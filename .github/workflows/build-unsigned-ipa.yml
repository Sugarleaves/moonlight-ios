name: Build unsigned iPad IPA

on:
  workflow_dispatch:
  push:
    branches:
      - desktop-touch-mode

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out Desktop Touch Mode
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Moonlight.xcodeproj

      - name: Build unsigned device application
        run: |
          xcodebuild \
            -project Moonlight.xcodeproj \
            -target Moonlight \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            SYMROOT="$RUNNER_TEMP/Build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build

      - name: Package IPA
        run: |
          APP_PATH="$RUNNER_TEMP/Build/Release-iphoneos/Moonlight.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/Payload/Moonlight.app"
          cd "$RUNNER_TEMP"
          zip -qry Moonlight-Desktop-Touch-unsigned.ipa Payload
          shasum -a 256 Moonlight-Desktop-Touch-unsigned.ipa > Moonlight-Desktop-Touch-unsigned.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-Desktop-Touch-unsigned
          path: |
            ${{ runner.temp }}/Moonlight-Desktop-Touch-unsigned.ipa
            ${{ runner.temp }}/Moonlight-Desktop-Touch-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
